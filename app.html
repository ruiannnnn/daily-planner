<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Planner（預覽）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE3; --card:#FFFCF6; --ink:#2B2925; --muted:#8C8475; --line:#E8DFCC;
  --green:#2F5D50; --green-soft:#E2EBE3; --red:#B5523B; --red-soft:#F5E1DA;
  --amber:#B9842C; --amber-soft:#F4E8CF; --shadow:0 1px 2px rgba(60,48,30,.06),0 6px 18px rgba(60,48,30,.06);
  --serif:'Noto Serif TC',serif; --sans:'Noto Sans TC',-apple-system,'PingFang TC',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C1A16; --card:#26231E; --ink:#EEE7D9; --muted:#A39A89; --line:#37322A;
  --green:#86B5A1; --green-soft:#2B3A33; --red:#E08D76; --red-soft:#43302A;
  --amber:#DDB065; --amber-soft:#3E3424; --shadow:none;
}}
input[type=checkbox]{accent-color:var(--green)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(150px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:.02em}
.hero{padding:10px 4px 18px}
.hero .date{color:var(--muted);font-size:13px;letter-spacing:.08em}
.hero h1{font-size:26px;margin-top:4px}
.page-title{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
.page-title h1{font-size:24px}
.back{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;padding:4px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.card-h h2{font-size:17px}
.card-h .sub{color:var(--muted);font-size:12.5px}
.card-h .side{display:flex;align-items:center;gap:10px}
.card-add{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--green);font-size:20px;line-height:1;display:grid;place-items:center;padding:0;align-self:center}
.leaflet-tile-pane .warm-tiles{filter:sepia(.18) saturate(.85) brightness(1.02)}
.card-add:active{background:var(--green);color:#fff}
.muted{color:var(--muted)} .small{font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:6px 0 2px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.tap{cursor:pointer}
.check{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--muted);flex:none;display:grid;place-items:center;transition:.15s}
.check.on{background:var(--green);border-color:var(--green)}
.check.on::after{content:'';width:9px;height:5px;border:2px solid var(--card);border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
.pri-高{border-color:var(--red)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.amber{background:var(--amber-soft);color:var(--amber)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--green)}
.big{font-family:var(--serif);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.over>i{background:var(--red)}
.btn{border:1px solid var(--green);color:var(--green);border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap}
.btn.solid{background:var(--green);color:var(--card)}
.habits{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.habit{border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;transition:.15s}
.habit .n{font-size:14px;font-weight:500;line-height:1.3}
.habit .p{font-size:11.5px;color:var(--muted)}
.habit.on{background:var(--green-soft);border-color:transparent}
.seg{display:flex;gap:6px;overflow-x:auto;padding:0 2px 12px;scrollbar-width:none}
.seg button{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13.5px;white-space:nowrap;background:var(--card)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group-h{font-family:var(--serif);font-size:14px;color:var(--muted);margin:4px 4px 6px;display:flex;justify-content:space-between}
.week{display:flex;gap:6px;margin-top:10px}
.day{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.day .c{width:30px;height:30px;margin:4px auto 0;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink);transition:.15s}
.day.on .c{background:var(--green);border-color:var(--green);color:var(--card)}
.day.today .c{border-color:var(--green)}
.day.future{opacity:.35;pointer-events:none}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats .l{font-size:12px;color:var(--muted)} .stats .v{font-family:var(--serif);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.cat .amt{text-align:right}
.cat{display:grid;grid-template-columns:76px 1fr 112px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;box-shadow:var(--shadow);min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile h3{font-size:16px} .tile .s{font-size:12.5px;color:var(--muted)}
.tile .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);margin-bottom:10px}
.stars{color:var(--amber);letter-spacing:1px;font-size:13px}
svg.spark{width:100%;height:70px;display:block}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar .in{display:flex;width:100%;max-width:520px}
.tabbar button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted)}
.tabbar button.on{color:var(--green);font-weight:500}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;background:var(--green);color:var(--card);font-size:28px;line-height:1;box-shadow:0 6px 20px rgba(47,93,80,.35);z-index:11}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,25,18,.38);opacity:0;pointer-events:none;transition:.2s;z-index:29}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:30}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:19px;margin-bottom:12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--green)}
.f input::-webkit-outer-spin-button,.f input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.f input[type=number]{-moz-appearance:textfield}
.f textarea{min-height:70px;resize:vertical}
.f input,.f select,.f textarea{box-sizing:border-box;max-width:100%}
.f input[type=date],.f input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:46px;line-height:1.3;text-align:left}
.f input[type=date]::-webkit-date-and-time-value,.f input[type=time]::-webkit-date-and-time-value{text-align:left}
.f .amount{font-family:var(--serif);font-size:26px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;background:var(--bg)}
.chips button.on{background:var(--green);border-color:var(--green);color:var(--card)}
.switch{display:flex;align-items:center;justify-content:space-between}
.switch input{width:auto;transform:scale(1.3)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;padding:12px;border-radius:14px;font-weight:500}
.actions .save{background:var(--green);color:var(--card)}
.actions .del{flex:none;padding:12px 16px;color:var(--red);border:1px solid var(--red-soft)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-top:1px dashed var(--line);font-size:16px;text-align:left}
.menu button:first-child{border-top:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:14px;overflow:hidden}
.pgrid .ph{position:relative;aspect-ratio:1;background:var(--line);cursor:pointer;overflow:hidden}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph .lab{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10.5px;line-height:1.3}
.pgrid .ph .lab b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.witem{display:flex;flex-direction:column;text-align:left;min-width:0}
.wimg{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line);display:block;width:100%}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.wph-none{width:100%;height:100%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wph-none span{background:rgba(255,252,246,.85);color:#3E3A39;font-size:11px;padding:2px 8px;border-radius:99px}
.witem .wname{font-size:13px;margin-top:5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.witem .wmeta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap}
.wflag{position:absolute;left:6px;top:6px;background:rgba(43,41,37,.75);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px}
.wdot{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
[data-chips="顏色"] .dot{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.wcols{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 12px;padding-bottom:2px;scrollbar-width:none}
.wcols button{flex:none;display:flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.wcols button.on{border-color:var(--ink);font-weight:700}
.wstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;min-height:20px}
.wstrip .wimg{width:58px;height:58px;flex:none}
.wmore{display:grid;place-items:center;font-weight:700;color:var(--muted)}
.wpick .witem .wcheck{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,252,246,.9);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.wpick .witem.on .wimg{box-shadow:0 0 0 3px var(--green)}
.wpick .witem.on .wcheck{background:var(--green);border-color:var(--green);color:#fff}
#obSel .wimg{width:52px;height:52px}
.wx{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:rgba(43,41,37,.7);color:#fff;font-size:12px;line-height:18px;text-align:center}
.sposter{position:relative;width:44px;height:58px;border-radius:8px;overflow:hidden;flex:none;background:var(--line)}
.sposter img{width:100%;height:100%;object-fit:cover;display:block}
.sposter span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center;line-height:15px}
.sbig{margin:0 auto 10px;max-width:260px;border-radius:12px;overflow:hidden;background:var(--line);box-shadow:var(--shadow)}
.sbig img{width:100%;display:block}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nitem{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.nimg{aspect-ratio:1;background:var(--line);overflow:hidden}
.nimg img{width:100%;height:100%;object-fit:cover;display:block}
.ninfo{padding:8px 10px 10px;min-width:0}
.ninfo .nt{font-size:14px;font-weight:500;line-height:1.35;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ninfo .nd{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nstar{color:#E2A93B;letter-spacing:1px;font-size:12px}
.tag.green{background:var(--green-soft);color:var(--green)}.tag.amber{background:var(--amber-soft);color:var(--amber)}
.shb{position:absolute;top:2px;right:3px;font-size:9.5px;line-height:1;padding:2px 3px;border-radius:5px;background:#DDE7EE;color:#56738A;font-weight:700;pointer-events:none}
.shb.ex{background:#C8D7E2;color:#46637A}
.shb.off{background:#F6DDD7;color:#B5523B}
.tl-shift{position:absolute;left:44px;right:0;background:repeating-linear-gradient(135deg,rgba(125,152,173,.13) 0 8px,rgba(125,152,173,.05) 8px 16px);border-left:3px solid #7D98AD;border-radius:0 8px 8px 0;pointer-events:none;z-index:0}
.tl-shift span{position:absolute;right:8px;top:4px;font-size:11px;color:#56738A;font-weight:700}
.shift-row .btn{padding:5px 10px;font-size:13px}
.acc-ic{width:28px;height:28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:15px;flex:none}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hwd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.hday{aspect-ratio:1;border-radius:50%;font-size:14px;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
.hday.on{background:var(--green);color:#fff;font-weight:700}
.hday.today{box-shadow:inset 0 0 0 2px var(--green)}
.hday:disabled{opacity:.3}
.hbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.hbar{display:flex;flex-direction:column;align-items:center;gap:3px}
.hbar i{display:block;width:60%;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--green-soft)}
.hbar.cur i{background:var(--green)}
.hbar .n{font-size:11px;color:var(--muted);min-height:14px}
.hbar .l{font-size:11px;color:var(--muted)}
.wwear{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green-soft);border-radius:14px;padding:10px 12px;margin-top:14px}
.wwear b{font-size:14px}
.wwear .btn{padding:6px 12px;font-size:13px}
.wwear .wbtn{background:var(--green);color:#fff;border-color:var(--green)}
.wlog{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.wlog:first-child{border-top:0}
.wlog-d{width:46px;flex:none;text-align:center;line-height:1.2}
.wlog-d b{display:block;font-size:20px;font-family:var(--serif)}
.wlog-d span{font-size:10.5px;color:var(--muted)}
.wdel{flex:none;width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px}
#cropper{position:fixed;inset:0;z-index:80;background:#151412;display:flex;flex-direction:column;color:#fff}
.cr-top{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;text-align:center;font-size:14px;opacity:.85}
.cr-stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.cr-stage img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none;pointer-events:none;max-width:none}
.cr-frame{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:1.5px dashed rgba(255,255,255,.75);border-radius:10px;pointer-events:none}
.cr-frame svg{position:absolute;inset:8%;width:84%;height:84%}
.cr-bot{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.cr-bot button{flex:1;padding:12px 0;border-radius:99px;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:15px}
.cr-bot button.on{background:#F2A497;border-color:#F2A497;color:#3E3A39;font-weight:700}
.pastebox{outline:none;text-align:center;line-height:1.5;-webkit-user-select:text;user-select:text;caret-color:transparent}
.pastebox:focus{border-color:var(--green);color:var(--green)}
.ootd{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.ootd .wimg{width:64px;height:64px;flex:none}
.ootd-it{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);text-align:center}
.ootd-it .wimg{width:78px;height:78px;background:#FFFFFF}
.ootd-it .wimg img{object-fit:contain}
.ootd-it span{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmmode{display:flex;justify-content:center;margin:-2px 0 10px}
.dmmode .mseg{display:inline-flex;background:var(--line);border-radius:99px;padding:3px}
.dmmode .mseg button{padding:5px 16px;border-radius:99px;font-size:13.5px;color:var(--muted)}
.dmmode .mseg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fzwrap{position:relative;width:min(100%, max(240px, calc((100vh - 440px) * .8)));width:min(100%, max(240px, calc((100dvh - 440px) * .8)));margin:0 auto}
.fzb{position:relative;width:100%;aspect-ratio:4/5;background:#FFFFFF;border:1px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.fz{position:absolute;touch-action:none;-webkit-touch-callout:none;transform-origin:50% 50%}
.fz img{transition:opacity .15s}
.fz img,.fz .wph-none{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.fz .wph-none{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12px;color:#8C8475}
.fz.sel{outline:1.5px dashed #8C8475;outline-offset:3px;border-radius:4px}
.fzform{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fzb.fzs{touch-action:auto;pointer-events:none;border-radius:14px}
.wo-board{position:relative;margin:0 0 12px}
.wo-board .btn{position:absolute;right:8px;bottom:8px;font-size:12.5px;padding:4px 10px;background:var(--card)}
.fzmini{width:96px;flex:none;aspect-ratio:4/5;border-radius:10px}
.fzb-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8C8475;font-size:13.5px;line-height:1.8;padding:20px;pointer-events:none}

.tl-date{flex:1;text-align:center;line-height:1.3}.tl-date b{font-family:var(--serif);font-size:17px;display:block}.tl-date span{font-size:12px;color:var(--muted)}
.tl-card{padding:12px 8px 12px 6px}
.tl{position:relative}

.vh-file{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

.mcal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}

const GAS = typeof google!=='undefined' && google.script && google.script.run;
/* 存取密碼：從網址的 ?k= 取得（主畫面外殼會自動帶上） */
let KEYP = null;
function appKey(){
  /* 先用這台裝置記住的密碼；再從網址確認一次（手機剛開啟時可能要等好幾秒） */
  let saved = ''; try { saved = localStorage.getItem('dpKey') || ''; } catch(e){}
  if (!KEYP) KEYP = new Promise(res => { let done = false; const fin = k => { if (done) return; done = true; if (k) { try { localStorage.setItem('dpKey', k); } catch(e){} } res(k || saved); };
    if (saved) fin(saved);
    try { google.script.url.getLocation(loc => { const k = (loc && loc.parameter && loc.parameter.k) || ''; if (k && k !== saved) { try { localStorage.setItem('dpKey', k); } catch(e){} } fin(k); }); } catch(e) { fin(''); }
    setTimeout(() => fin(''), 8000); });
  return KEYP;
}
/* 連線不穩時自動重試（Google 伺服器偶爾會慢或暫時出錯） */
async function callRetry(fn, args, tries){
  for (let i = 0; ; i++) {
    try { return await call(fn, ...(args||[])); }
    catch(e) {
      const msg = String(e && e.message || e);
      if (/密碼不正確/.test(msg) && i === 0) { KEYP = null; try { localStorage.removeItem('dpKey'); } catch(_){} }
      if (i >= (tries||3) - 1) throw e;
      await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
}
function call(fn, ...args){
  return new Promise((res, rej) => {
    const ok = r => res(r && r._partial ? mergeTables(r) : r);
    if (GAS) appKey().then(k => google.script.run.withSuccessHandler(ok).withFailureHandler(rej).api(k, fn, args));
    else setTimeout(() => { try { const r = Local[fn](...args); if (r && r._today && fn!=='getAll' && !('_added' in r)) r._partial = true; ok(r); } catch(e){ rej(e); } }, window.LOCAL_DELAY || 120);
  });
}
/* 伺服器只回傳有變動的表：合併進目前資料，再把還沒同步完的本機變更補回去 */
let PENDING = [];
function mergeTables(r){
  const out = Object.assign({}, D || {});
  Object.keys(r).forEach(k => { if (k!=='_partial') out[k] = r[k]; });
  D = out; PENDING.forEach(p => p.apply());
  return D;
}

function newId(){ return 'N' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function keyOf(name){ return name==='預算分類' ? '分類' : 'ID'; }
function upLocal(name, o){ const k=keyOf(name), list=(D[name]=(D[name]||[]).slice()); const i=list.findIndex(x=>String(x[k])===String(o[k])); if (i>=0) list[i]=Object.assign({}, list[i], o); else list.push(Object.assign({}, o)); }
function optimistic(fn, args){
  const [a, b] = args;
  if (fn==='saveRow') { if (keyOf(a)==='ID' && !b.ID) b.ID = newId(); return () => upLocal(a, b); }
  if (fn==='saveRows') { if (keyOf(a)==='ID') b.forEach(o => { if (!o.ID) o.ID = newId(); }); return () => b.forEach(o => upLocal(a, o)); }
  if (fn==='deleteRow') return () => { D[a] = (D[a]||[]).filter(x => String(x[keyOf(a)])!==String(b)); };
  if (fn==='deleteProject') return () => { D['專案']=(D['專案']||[]).filter(x=>x.ID!==a); ['專案步驟','專案名單'].forEach(t => D[t]=(D[t]||[]).filter(x=>x['專案ID']!==a)); };
  if (fn==='deleteTrip') return () => { D['旅遊']=(D['旅遊']||[]).filter(x=>x.ID!==a); ['旅遊行程','旅遊清單'].forEach(t => D[t]=(D[t]||[]).filter(x=>x['旅遊ID']!==a)); };
  if (fn==='completeTask') return () => upLocal(b||'待辦行程', {ID:a, '狀態':'完成'});
  if (fn==='reopenTask') return () => upLocal(b||'待辦行程', {ID:a, '狀態':'未開始'});
  if (fn==='finishMedia') return () => upLocal('觀影閱讀', {ID:a, '狀態':'已完成', '完成日':TODAY()});

    return hit ? () => { D['打卡紀錄']=(D['打卡紀錄']||[]).filter(l=>!(l['習慣']===a && l['日期']===day)); } : () => { if (!(D['打卡紀錄']||[]).some(l=>l['習慣']===a && l['日期']===day)) upLocal('打卡紀錄', {ID:'tmp-'+a+day, '日期':day, '習慣':a}); }; }
  return null;
}
let QUEUE = Promise.resolve();
let lastFetch = 0, refreshing = false, WGEN = 0;
async function refreshData(manual, force){
  if (refreshing || (PENDING.length && !force)) return; refreshing = true;
  const btn = document.querySelector('.refresh'); if (btn) btn.classList.add('spin');
  if (manual) toast('從試算表更新中…');
  const gen = WGEN;
  try { const r = await callRetry('getAll', [], 2);
    /* 讀取期間若有新的修改，這份資料已經過時：丟掉，避免把剛做的動作蓋回去 */
    if (r && (gen !== WGEN || PENDING.length)) { lastFetch = 0; if (manual) toast('已更新 ✓', 1200); return; }
    if (r) { D = r; lastFetch = Date.now(); cache(); PHOTOS = null; WALL = null; TPHOTOS = null; render(); } if (manual) toast('已更新 ✓', 1200); }
  catch(e){ if (manual) toast('更新失敗：'+(e.message||e), 3500); }
  finally { refreshing = false; const b = document.querySelector('.refresh'); if (b) b.classList.remove('spin'); }
}
function run(fn, args, msg){
  const apply = optimistic(fn, args);
  const job = apply ? { apply } : null;
  WGEN++;
  if (job) { job.apply(); PENDING.push(job); render(); syncDot(); }
  else toast(msg||'儲存中…');
  const done = QUEUE.then(async () => {
    try { await call(fn, ...args); }
    catch(e){ if (job) PENDING = PENDING.filter(p => p!==job); toast('同步失敗：'+(e.message||e)+'，已重新讀取', 4000); syncDot(); return refreshData(false, true); }
    if (job) PENDING = PENDING.filter(p => p!==job);
    if (job) PENDING.forEach(p => p.apply());
    WGEN++; lastFetch = Date.now(); cache(); syncDot();
    if (!PENDING.length) { renderKeep(); if (!job) toast('已儲存 ✓', 1000); }
  });
  QUEUE = done.catch(()=>{});
  return job ? Promise.resolve() : done;
}

function taskRow(t, showDate, src){

function habitStats(h){
  const logs = (D['打卡紀錄']||[]).filter(l => l['習慣']===h.ID);
  const set = new Set(logs.map(l=>l['日期']));
  const ws = weekStart(TODAY());
  let week=0; for(let i=0;i<7;i++) if(set.has(addDays(ws,i))) week++;
  let streak=0, d=set.has(TODAY())?TODAY():addDays(TODAY(),-1);
  while(set.has(d)){ streak++; d=addDays(d,-1); }
  return {set, week, streak, today:set.has(TODAY())};
}

function monthSum(m){

function spark(vals){
  if (vals.length<2) return '<div class="empty">至少要兩筆紀錄才能畫趨勢。</div>';
  const W=300,H=70,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(W-12)+6, H-8-(v-mn)/r*(H-22)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--green)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--green)"/></svg>`;
}

function shiftM(s, m){ const p=s.split('-').map(Number); const last=new Date(p[0],p[1]-1+m+1,0).getDate(); return ymd(new Date(p[0],p[1]-1+m,Math.min(p[2],last))); }
function calEvents(from, to){
  const ev = [];
  (D['待辦行程']||[]).forEach(t => {
    if (!t['日期']) return;
    const tag = tagOf(t['分類']), done = t['狀態']==='完成';
    const len = t['結束日期'] && t['結束日期'] > t['日期'] ? Math.min(60, diff(t['結束日期'], t['日期'])) : 0;
    const push = (s0, virtual) => { const z = addDays(s0, len); if (z < from || s0 > to) return;
      for (let k = 0; k <= len; k++) { const d = addDays(s0, k); if (d>=from && d<=to) ev.push({d, a:s0, z, rep:t['重複']||'', time:k===0?(t['時間']||''):'', end:k===0?(t['結束時間']||''):'', title:t['標題'], tag, src:'待辦行程', id:t.ID, done, virtual, meta:[t['類型']!=='待辦'?t['類型']:'', len?'第 '+(k+1)+' / '+(len+1)+' 天':'', t['地點']?'📍'+t['地點']:'', t['同行者']?'與 '+t['同行者']:''].filter(Boolean).join(' · ')}); } };

const SEARCH_SRC = [
  ['待辦行程','待辦／行程'],['工作事項','工作'],['重要日期','班級重要日期'],['筆記','筆記'],['記帳','記帳'],['追星紀錄','追星紀錄'],

  ['專案','專案'],['專案步驟','專案步驟'],['專案名單','專案名單'],['訂閱帳單','訂閱帳單'],['上課紀錄','上課紀錄'],['班級日誌','考試與作業'],['健康紀錄','健康紀錄']];
const SKIP_K = new Set(['專案ID','名單狀態','ID','縮圖','檔案ID','緯度','經度','旅遊ID','行程ID','習慣']);
function titleOf(t, r){ const k = (SCHEMA[t]||{}).label; return String((k && r[k]) || r['標題'] || r['名稱'] || r['活動名稱'] || r['作者'] || r['說明'] || r['項目'] || r['分類'] || r['班級'] || r['日期'] || '（未命名）'); }
function dateOf(r){ for (const k of ['日期','截止日','上課日期','出發日','發行日','去過日期']) if (r[k]) return String(r[k]).slice(0,10); return ''; }
const nz = x => String(x).toLowerCase().replace(/臺/g,'台');
function hl(text, q){ const s = String(text), i = nz(s).indexOf(nz(q)); if (i<0) return esc(s); return esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i, i+q.length)) + '</mark>' + esc(s.slice(i+q.length)); }
function snippet(text, q){ const s = String(text).replace(/\s+/g,' '), i = nz(s).indexOf(nz(q)); const a = Math.max(0, i-14); return (a?'…':'') + hl(s.slice(a, i+q.length+26), q) + (i+q.length+26 < s.length ? '…' : ''); }
function doSearch(q){
  q = q.trim(); const box = $('#sres'); if (!box) return;
  if (!q) { box.innerHTML = '<div class="empty">輸入關鍵字，會同時搜尋待辦、筆記、記帳、追星、韋基百科、貼文、旅遊、想去清單…</div>'; return; }
  const ql = nz(q); let total = 0;
  const groups = SEARCH_SRC.map(([t, label]) => {
    const hits = (D[t]||[]).map(r => { const title = titleOf(t, r); if (nz(title).includes(ql)) return {r, title, sub:''};
        for (const k of Object.keys(r)) { if (SKIP_K.has(k)) continue; const v = r[k]; if (v==null || v==='' || typeof v==='boolean') continue; if (t==='筆記' && k==='內容' && isNoteHtml(v)) { const tx = noteText(v); if (nz(tx).includes(ql)) return {r, title, sub: k+'：'+snippet(tx, q)}; continue; } if (nz(v).includes(ql)) return {r, title, sub: k+'：'+snippet(v, q)}; }
        return null; }).filter(Boolean)
      .sort((a,b)=>dateOf(b.r).localeCompare(dateOf(a.r)));
    total += hits.length;
    return hits.length ? `<div class="group-h"><span>${label}</span><span>${hits.length}</span></div><section class="card">${hits.slice(0,20).map(h=>`<div class="row tap" data-act="sgo" data-t="${t}" data-id="${esc(h.r.ID)}"><div class="main"><div class="t">${hl(h.title, q)}</div><div class="m">${[dateOf(h.r) && esc(nice(dateOf(h.r))), h.sub].filter(Boolean).join(' · ')}</div></div></div>`).join('')}${hits.length>20?`<div class="small muted" style="padding:6px 2px">還有 ${hits.length-20} 筆，請再加關鍵字縮小範圍</div>`:''}</section>` : '';
  }).join('');
  box.innerHTML = total ? `<div class="small muted" style="margin:2px 0 8px">共 ${total} 筆</div>` + groups : '<div class="empty">找不到「'+esc(q)+'」。</div>';
}

    const f = list[i], tag = list.length > 1 ? ` ${i+1}/${list.length}` : '';

      if (String(f.type).startsWith('video/') || /\.(mov|mp4|m4v|webm)$/i.test(f.name||'')) {
        if (f.size > 500*1024*1024) { toast('影片超過 500MB，請先剪短或壓縮再上傳', 4000); continue; }

        const CH = 6*1024*1024; let fileId = '';

        if (!fileId) throw new Error('影片沒有傳完整，請再試一次');

        step = '讀取圖片';
        const full = await resizeImage(f, 1600, 0.85);
        const thumb = await makeThumb(f);
        step = '上傳到雲端';

        step = '';

  }

/* 縮圖：一路縮小、降低畫質，直到小於試算表一格能放的大小 */
async function makeThumb(file, big){
  const steps = (big ? [[520,.72]] : []).concat([[420,.72],[360,.62],[300,.55],[240,.5],[200,.45],[160,.4]]);
  for (const [m, q] of steps) { const t = await resizeImage(file, m, q); if (t.length <= 45000) return t; }
  throw new Error('這張圖片的縮圖做不出來，請換一張或先截圖再上傳');
}
function resizeImage(file, max, quality){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k)); const g = c.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取這張圖片')); };
    img.src = url;
  });
}
async function uploadPhotos(eventId, files){
  const list = [...files]; if (!list.length) return;
  if (!PHOTOS) PHOTOS = [];
  for (let i = 0; i < list.length; i++) {
    toast(`上傳照片 ${i+1} / ${list.length}…`);
    try {
      const full = await resizeImage(list[i], 1600, 0.85);
      const thumb = await makeThumb(list[i]);
      const p = await call('uploadPhoto', eventId, full.split(',')[1], thumb, list[i].name || 'photo.jpg');
      PHOTOS.push(p);
    } catch(e) { toast('上傳失敗：'+(e.message||e), 3500); return; }
  }
  toast('照片已上傳 ✓', 1500); WALL = null; render(); viewEvent(eventId);
}

/* 螢光筆：選取的文字加上底色＋同色系文字（像 iOS 備忘錄的標示）；c 空白＝清除 */

/* ---------- 筆記格式工具列（仿 iOS 備忘錄） ---------- */
let NOTE_RANGE = null;
const NT = () => $('#noteText');
function inNote(node){ const e = NT(); return e && node && (node === e || e.contains(node)); }
document.addEventListener('selectionchange', () => { const sel = getSelection(); if (sel.rangeCount && inNote(sel.anchorNode)) { NOTE_RANGE = sel.getRangeAt(0).cloneRange(); fmtState(); } });
function restoreRange(){ const e = NT(); e.focus(); if (NOTE_RANGE && inNote(NOTE_RANGE.startContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(NOTE_RANGE); } }
function curEl(tag){ const s = getSelection(); let n = s.rangeCount ? s.anchorNode : null; while (n && n !== NT()) { if (n.nodeType === 1 && (!tag || tag.includes(n.tagName))) return n; n = n.parentNode; } return null; }
function curList(){ return curEl(['UL','OL']); }
function listKind(l){ return !l ? '' : l.tagName === 'OL' ? 'number' : l.classList.contains('checklist') ? 'check' : l.classList.contains('dashed') ? 'dash' : 'bullet'; }
function setList(kind){
  restoreRange(); let l = curList(); const k = listKind(l);
  if (k === kind) { document.execCommand(l.tagName === 'OL' ? 'insertOrderedList' : 'insertUnorderedList'); }
  else if (kind === 'number') document.execCommand('insertOrderedList');
  else { if (!l || l.tagName === 'OL') document.execCommand('insertUnorderedList'); l = curList(); if (l) { l.classList.remove('checklist','dashed'); if (kind !== 'bullet') l.classList.add(kind === 'check' ? 'checklist' : 'dashed'); if (kind !== 'check') l.querySelectorAll('li.checked').forEach(li=>li.classList.remove('checked')); if (!l.className) l.removeAttribute('class'); } }
  noteChanged();
}
function setBlock(tag){
  restoreRange(); const cur = curEl(['H1','H2','H3','PRE','BLOCKQUOTE']);
  if (curList() && tag !== 'p') { const l = curList(); document.execCommand(l.tagName === 'OL' ? 'insertOrderedList' : 'insertUnorderedList'); }
  if (tag === 'blockquote') document.execCommand('formatBlock', false, cur && cur.tagName === 'BLOCKQUOTE' ? 'div' : 'blockquote');
  else document.execCommand('formatBlock', false, tag === 'p' ? 'div' : tag);
  noteChanged();
}
function fmtState(){
  const bar = $('#edBar'); if (!bar || !$('#editor').classList.contains('show')) return;
  const la = curEl(['A']), tip = $('#linkTip');
  if (tip) { if (la && la.getAttribute('href')) { tip.innerHTML = `<a href="${esc(la.getAttribute('href'))}" target="_blank" rel="noopener">開啟連結 ↗</a><span>${esc(la.getAttribute('href'))}</span><button type="button" data-ln="edit">編輯</button>`; tip.classList.add('show'); } else tip.classList.remove('show'); }
  const blk = curEl(['H1','H2','H3','PRE']), b = blk ? blk.tagName.toLowerCase() : 'p', lk = listKind(curList()), q = !!curEl(['BLOCKQUOTE']);
  bar.querySelectorAll('[data-fmt]').forEach(x => { const f = x.dataset.fmt; let on = false;
    if (['h1','h2','h3','pre','p'].includes(f)) on = f === b;
    else if (['bold','italic','underline','strikeThrough'].includes(f)) { try { on = document.queryCommandState(f); } catch(e){} if (f==='bold' && on && curEl(['MARK']) && !curEl(['B','STRONG'])) on = false; }
    else if (['bullet','dash','number','check'].includes(f)) on = f === lk;
    else if (f === 'quote') on = q;
    else if (f === 'panel') on = $('#fmtPanel').classList.contains('show');
    x.classList.toggle('on', on); });
}
function noteChanged(){ fmtState(); if (NOTE) { clearTimeout(noteTimer); noteTimer = setTimeout(()=>saveNote(false), 2000); } }
(function initNoteBar(){
  const bar = $('#edBar');
  const keep = e => { if (e.target.closest('button')) e.preventDefault(); };
  bar.addEventListener('pointerdown', keep); bar.addEventListener('mousedown', keep); bar.addEventListener('touchstart', e => { if (e.target.closest('button') && e.cancelable) e.preventDefault(); const b = e.target.closest('button'); if (b) b.click(); }, {passive:false});
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-fmt]'); if (!b) return; const f = b.dataset.fmt;
    if (f === 'panel') { $('#fmtPanel').classList.toggle('show'); fmtState(); placeBar(); return; }
    if (f === 'link') { openLinkSheet(); return; }
    if (f === 'hl') { applyHighlight(b.dataset.c); return; }
    if (f === 'kbd') { $('#fmtPanel').classList.remove('show'); NT().blur(); $('#noteTitle').blur(); fmtState(); return; }
    if (['h1','h2','h3','pre','p','quote'].includes(f)) return setBlock(f === 'quote' ? 'blockquote' : f);
    if (['bullet','dash','number','check'].includes(f)) return setList(f);
    restoreRange(); document.execCommand(f); noteChanged();
  });
  const ed = NT();
  // 點核對清單左邊的圓圈：打勾／取消
  ed.addEventListener('click', e => { const li = e.target.closest && e.target.closest('ul.checklist > li'); if (!li) return; const x = e.clientX - li.getBoundingClientRect().left; if (x < 30) { e.preventDefault(); li.classList.toggle('checked'); noteChanged(); } });
  ed.addEventListener('input', e => {
    if (e.inputType === 'insertParagraph') { const li = curEl(['LI']); if (li && !li.textContent.trim()) li.classList.remove('checked'); }
    if (!ed.textContent.trim() && !ed.querySelector('li,img')) ed.innerHTML = '';
    noteChanged();
  });
  // 貼上時只保留文字，避免把網頁的顏色、字體一起貼進來
  ed.addEventListener('paste', e => { const cd = e.clipboardData || window.clipboardData; const imgs = cd ? [...(cd.items||[])].filter(it => it.kind==='file' && /^image\//.test(it.type)).map(it => it.getAsFile()).filter(Boolean) : [];
    if (imgs.length) { e.preventDefault(); e.stopPropagation(); insertNoteImages(imgs); return; }
    const t = cd.getData('text/plain'); if (t == null) return; e.preventDefault(); document.execCommand('insertText', false, t); });
  // 工具列跟著鍵盤上移
  const vv = window.visualViewport;
  // 鍵盤打開時（或主畫面外殼把網站縮到鍵盤上方時），拿掉底部給 Home 橫條的留白
  function placeBar(){ if (!vv) return; const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); if (window.innerHeight > (placeBar.maxH||0)) placeBar.maxH = window.innerHeight; const shrunk = placeBar.maxH - window.innerHeight > 150; bar.style.bottom = off + 'px'; bar.style.paddingBottom = (off > 0 || shrunk) ? '6px' : ''; }
  window.placeBar = placeBar;
  if (vv) { vv.addEventListener('resize', placeBar); vv.addEventListener('scroll', placeBar); }
  window.addEventListener('resize', placeBar); window.addEventListener('orientationchange', () => { placeBar.maxH = 0; setTimeout(placeBar, 400); }); placeBar();
})();

const FONTS = [
  {k:'noto-sans', n:'思源黑體', fam:"'Noto Sans TC'", q:'Noto+Sans+TC:wght@400;500;700', d:'清楚好讀，適合內文'},

  {k:'wenkai', n:'霞鶩文楷', fam:"'LXGW WenKai TC'", q:'LXGW+WenKai+TC:wght@400;700', d:'像手寫楷書，手帳感最強'},
  {k:'iansui', n:'芫荽', fam:"'Iansui'", q:'Iansui', d:'自然隨性的手寫字'},

  {k:'choco', n:'朱古力黑體', fam:"'Chocolate Classical Sans'", q:'Chocolate+Classical+Sans', d:'帶點復古味的黑體'}
];
const FONT_DEF = {title:'huninn', body:'huninn'};
const loadedFonts = new Set(['noto-sans','noto-serif','huninn']);
function loadFont(k){ if (loadedFonts.has(k)) return; const f=FONTS.find(x=>x.k===k); if(!f) return; loadedFonts.add(k); const l=document.createElement('link'); l.rel='stylesheet'; l.href='https:\/\/fonts.googleapis.com/css2?family='+f.q+'&display=swap'; document.head.appendChild(l); }
function getFontPref(){ try { return Object.assign({}, FONT_DEF, JSON.parse(localStorage.getItem('lifeapp-font')||'{}')); } catch(e){ return Object.assign({}, FONT_DEF); } }
function applyFonts(){
  const p = getFontPref(), t = FONTS.find(x=>x.k===p.title)||FONTS[1], b = FONTS.find(x=>x.k===p.body)||FONTS[0];
  loadFont(t.k); loadFont(b.k);
  document.documentElement.style.setProperty('--serif', t.fam+",'Noto Serif TC',serif");
  document.documentElement.style.setProperty('--sans', b.fam+",'Noto Sans TC',-apple-system,'PingFang TC',sans-serif");
}
function setFont(role, k){ const p=getFontPref(); p[role]=k; try{ localStorage.setItem('lifeapp-font', JSON.stringify(p)); }catch(e){} applyFonts(); openFontSheet(role); }
function openFontSheet(role){
  role = role || 'title'; FONTS.forEach(f=>loadFont(f.k)); const p = getFontPref();
  openSheet(`<h2>字體</h2><div class="big-seg">${[['title','標題字體'],['body','內文字體']].map(([r,l])=>`<button type="button" class="${role===r?'on':''}" data-font="${p[r]}" data-role="${r}">${l}</button>`).join('')}</div>
    <div class="menu">${FONTS.map(f=>`<button data-font="${f.k}" data-role="${role}" style="display:block;font-family:${esc(f.fam)},sans-serif">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:19px;font-weight:${role==='title'?700:400}">${f.n}｜今天也要好好生活</span>${p[role]===f.k?'<span class="tag">使用中</span>':''}</div>
      <div class="small muted" style="font-family:var(--sans)">${f.d}</div></button>`).join('')}</div>
    <div class="small muted" style="margin-top:10px">字體設定存在這支手機上，換手機要再選一次。</div>`);
}

function readForm(form){

    if (f.t==='dur' || f.t==='alarm') continue;

    if (box && box.closest('[data-hidden]')) { o[f.k] = ''; continue; }
    if (f.t==='acct') { const nv = form.querySelector(`[name="${f.k}__new"]`).value.trim(), on = form.querySelector(`[data-chips="${f.k}"] .on`); o[f.k] = nv || (on ? on.dataset.v : ''); }
    else if (f.t==='range') o[f.k] = Number(form.querySelector(`[name="${f.k}"]`).value);
    else if (f.t==='multi') o[f.k] = [...form.querySelectorAll(`[data-chips="${f.k}"] .on`)].map(b=>b.dataset.v).join('、');
    else if (f.t==='chips'||f.t==='cat'||f.t==='subj'){ const on=form.querySelector(`[data-chips="${f.k}"] .on`); o[f.k] = on ? (typeof (f.o||[])[0]==='number'?Number(on.dataset.v):on.dataset.v) : ''; }
    else if (f.t==='bool') o[f.k] = form.querySelector(`[name="${f.k}"]`).checked;
    else { const v=form.querySelector(`[name="${f.k}"]`).value.trim(); o[f.k] = (f.t==='num'||f.t==='money'||f.t==='fx') ? (v===''?'':Number(v)) : v; }

  if (name==='旅遊' && o['範圍']!=='國外') ['去程航班','去程起飛','去程抵達','去程機場','回程航班','回程起飛','回程抵達','回程機場','航班備註'].forEach(k=>o[k]='');
  if (name==='收納') o['更新時間'] = nowStr();

  if ((name==='衣櫃' || name==='想買' || name==='美甲') && !form.dataset.id) o['建立時間'] = nowStr();

    completeTask(id,name){ name=name||'待辦行程'; const dk=name==='工作事項'?'截止日':'日期'; const t=get(name,id); if(t&&t.狀態!=='完成'){ t.狀態='完成'; const r={'每天':[0,1],'每週':[0,7],'每月':[1,0],'每年':[12,0]}[t.重複]; if(r&&t[dk]){ const n=Object.assign({},t,{狀態:'未開始',[dk]:shift(t[dk],r[0],r[1])}); delete n.ID; if(!t['重複結束']||n[dk]<=t['重複結束']) upsert(name,n);} } return snap(); },
    reopenTask(id,name){ get(name||'待辦行程',id).狀態='未開始'; return snap(); },
    toggleCheckIn(h,day){ const i=db['打卡紀錄'].findIndex(l=>l.習慣===h&&l.日期===day); if(i>=0) db['打卡紀錄'].splice(i,1); else upsert('打卡紀錄',{日期:day,習慣:h,備註:''}); return snap(); },
    paySubscription(id){ const s=get('訂閱帳單',id); upsert('記帳',{日期:T,收支:'支出',金額:s.金額,分類:'訂閱帳單',帳戶:s.付款方式,說明:s.名稱}); s.下次扣款日=shift(s.下次扣款日||T,{'每月':1,'每兩月':2,'每季':3,'每年':12}[s.週期]||1,0); return snap(); },
    finishMedia(id){ Object.assign(get('觀影閱讀',id),{狀態:'已完成',完成日:T}); return snap(); }
  };
})();

/* ================= 啟動 ================= */
applyFonts();
(async function init(){
  if (GAS) { let c = null; try { c = localStorage.getItem('lifeapp'); } catch(e){}
    if (!c) c = await cacheFromShell();
    try { if (c) { D = JSON.parse(c); render(); window.__booted = true; } } catch(e){ D = null; } }
  try { const r = await callRetry('getAll', [], 3); if (!r) throw new Error('伺服器回傳空資料');
    const had = !!D; D = r; lastFetch = Date.now(); cache(); if (had) renderKeep(); else render(); window.__booted = true; }
  catch(e){ window.__booted = true;
    const msg = String(e.message||e).replace(/^Error:\s*/,'');
    if (D) toast('暫時連不上伺服器，先顯示上次的資料（'+msg.slice(0,40)+'）', 5000);
    else $('#app').innerHTML = `<div class="loading" style="line-height:1.8">讀取失敗：${esc(msg)}<br><button class="btn solid" style="margin-top:12px" onclick="location.reload()">重新載入</button></div>`; }
})();
</script>
<!-- 電腦版：橫向標籤列可以用滑鼠滾輪、拖曳捲動，兩側有淡出提示（貼在 Index.html 最後的 </body> 前面） -->
<style>
  .hs-l { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px); mask-image: linear-gradient(90deg, transparent 0, #000 28px); }
  .hs-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent 100%); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent 100%); }
  .hs-l.hs-r { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%); }
  .hs-drag { cursor: grabbing !important; user-select: none; }
  @media (hover: hover) and (pointer: fine) {
    .hs-on { cursor: grab; scrollbar-width: thin !important; scrollbar-color: rgba(140,132,117,.45) transparent; }
    .hs-on::-webkit-scrollbar { display: block !important; height: 6px; }
    .hs-on::-webkit-scrollbar-thumb { background: rgba(140,132,117,.45); border-radius: 3px; }
  }
</style>
<script>
(function () {
  /* 找出可以橫向捲動的那一排 */
  function hRow(el) {
    while (el && el !== document.body && el.nodeType === 1) {
      if (el.scrollWidth > el.clientWidth + 2) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') return el;
      }
      el = el.parentElement;
    }
    return null;
  }
  /* 兩側淡出：還有內容沒看到的那一側會變淡 */
  function fades() {
    document.querySelectorAll('.seg, .big-seg, .chips, .styles, .tabs, nav, [class*="tab"], [style*="overflow-x"]').forEach(function (el) {
      if (el.classList.contains('hs-on') || (el.scrollWidth > el.clientWidth + 2 && /auto|scroll/.test(getComputedStyle(el).overflowX) && el.offsetHeight < 140)) {
        var can = el.scrollWidth > el.clientWidth + 2;
        el.classList.toggle('hs-on', can);
        el.classList.toggle('hs-l', can && el.scrollLeft > 2);
        el.classList.toggle('hs-r', can && el.scrollLeft + el.clientWidth < el.scrollWidth - 2);
      }
    });
  }
  var t = null;
  function soon() { clearTimeout(t); t = setTimeout(fades, 60); }
  new MutationObserver(soon).observe(document.body, { childList: true, subtree: true });
  window.addEventListener('resize', soon);
  document.addEventListener('scroll', function (e) { var el = e.target; if (el && el.classList && el.classList.contains('hs-on')) { el.classList.toggle('hs-l', el.scrollLeft > 2); el.classList.toggle('hs-r', el.scrollLeft + el.clientWidth < el.scrollWidth - 2); } }, true);
  soon();
  /* 滑鼠滾輪上下滾 → 這一排左右捲 */
  document.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    var row = hRow(e.target); if (!row || row.offsetHeight > 140) return;
    var before = row.scrollLeft; row.scrollLeft += e.deltaY;
    if (row.scrollLeft !== before) e.preventDefault();
  }, { passive: false });
  /* 用滑鼠按住拖曳 */
  var drag = null;
  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    var row = hRow(e.target); if (!row || row.offsetHeight > 140) return;
    drag = { row: row, x: e.clientX, left: row.scrollLeft, moved: false };
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return; var dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; drag.row.classList.add('hs-drag'); }
    if (drag.moved) drag.row.scrollLeft = drag.left - dx;
  });
  document.addEventListener('pointerup', function () {
    if (!drag) return; var d = drag; drag = null; d.row.classList.remove('hs-drag');
    if (d.moved) { var stop = function (ev) { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click', stop, true); setTimeout(function () { document.removeEventListener('click', stop, true); }, 0); }
  });
})();
</script>
