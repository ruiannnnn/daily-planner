<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5EFE3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Daily Planner</title>
<style>
  html, body { margin: 0; height: 100%; background: #F5EFE3; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #app { z-index: 1; position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top); width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: #F5EFE3; }
  #msg { font-family: -apple-system, "PingFang TC", sans-serif; color: #2B2925; padding: 48px 28px; line-height: 1.8; display: none; }
  #msg h1 { font-family: Georgia, "Songti TC", serif; font-size: 26px; margin: 0 0 10px; color: #2F5D50; }
  #sa { position: fixed; top: 0; left: 0; width: 0; height: env(safe-area-inset-top); visibility: hidden; pointer-events: none; }
  #loading { position: fixed; inset: 0; z-index: 2; background: #F5EFE3; display: grid; place-items: center; font-family: Georgia, "Songti TC", serif; color: #8C8475; font-size: 15px; }
  #loading img { width: 72px; height: 72px; border-radius: 16px; display: block; margin: 0 auto 12px; }
</style>
</head>
<body>
<div id="sa"></div>
<div id="loading"><div><img src="apple-touch-icon.png" alt="">翻開手帳中…<div style="font-size:11px;opacity:.5;margin-top:6px;text-align:center">v4</div></div></div>
<div id="msg"><h1>Daily Planner</h1>還沒有設定網址。請在 Apps Script 編輯器執行 <b>setupKey</b>，把執行記錄裡「#u=…&amp;k=…」那段接在這個網頁網址後面再打開，然後再加入主畫面。</div>
<script>
  // 網址片段格式：#u=<Apps Script 部署網址>&k=<密碼>
  // 片段（# 後面）不會傳到 GitHub 伺服器，只存在你的手機裡
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    var u = h.get('u'), k = h.get('k');
    try {
      if (u && k) { localStorage.setItem('dp_u', u); localStorage.setItem('dp_k', k); }
      else { u = localStorage.getItem('dp_u'); k = localStorage.getItem('dp_k'); }
    } catch (e) {}
    if (!u || !k) { document.getElementById('loading').style.display = 'none'; document.getElementById('msg').style.display = 'block'; return; }
    var f = document.createElement('iframe');
    f.id = 'app';
    f.src = u + (u.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(k);
    f.allow = 'clipboard-write; geolocation';
    f.onload = function () { setTimeout(function () { document.getElementById('loading').style.display = 'none'; }, 300); };
    document.body.appendChild(f);

    // 拍衣服相機：要用時才載入
    var camP = null;
    function loadCam() { if (camP) return camP; camP = new Promise(function (res, rej) { var s = document.createElement('script'); s.src = 'camera.js?v=1'; s.onload = res; s.onerror = function () { camP = null; rej(); }; document.head.appendChild(s); }); return camP; }

    // 幫網站保存一份資料快取：下次打開先顯示上次的內容，不用等伺服器
    window.addEventListener('message', function (e) {
      if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin) || !e.data || !e.data.dp) return;
      if (e.data.dp === 'save' && typeof e.data.data === 'string') { try { localStorage.setItem('dp_cache', e.data.data); } catch (err) {} }
      else if (e.data.dp === 'hello') { try { e.source.postMessage({ dp: 'hi', cam: 1 }, e.origin); } catch (err) {} }
      else if (e.data.dp === 'camera') {
        var src = e.source, org = e.origin, req = e.data;
        loadCam().then(function () { window.DPCam.open(req, function (res) { try { src.postMessage(Object.assign({ dp: 'camdone', id: req.id }, res), org); } catch (err) {} }); })
          .catch(function () { try { src.postMessage({ dp: 'camdone', id: req.id, error: '相機載入失敗' }, org); } catch (err) {} });
      }
      else if (e.data.dp === 'load') { var c = null; try { c = localStorage.getItem('dp_cache'); } catch (err) {} try { e.source.postMessage({ dp: 'cache', data: c }, e.origin); } catch (err) {} }
    });

    // 鍵盤打開時：把網站縮到鍵盤上方，筆記才能往下捲、格式工具列也不會被鍵盤蓋住
    var vv = window.visualViewport;
    if (vv) {
      var sa = document.getElementById('sa');
      var full = Math.max(window.innerHeight, vv.height);       // 沒有鍵盤時的高度
      var fit = function () {
        var top = sa.offsetHeight || 0;
        if (vv.height > full) full = vv.height;
        var kbd = full - vv.height > 120;                        // 可視高度明顯變矮＝鍵盤打開
        if (kbd) {
          f.style.top = (vv.offsetTop + top) + 'px';
          f.style.height = (vv.height - top) + 'px';
          f.style.bottom = 'auto';
        } else {
          f.style.top = ''; f.style.height = ''; f.style.bottom = '';
          if (window.scrollY) window.scrollTo(0, 0);
        }
      };
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { full = 0; setTimeout(function () { full = Math.max(window.innerHeight, vv.height); fit(); }, 400); });
    }
  })();
</script>
</body>
</html>
